name: Build Frontend

on:
  push:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }} \
            --build-arg VITE_MAIN_API_URL=${{ secrets.VITE_MAIN_API_URL }} \
            -t ghcr.io/reijbak/riwiwallet-frontend:latest .

      - name: Push image
        run: docker push ghcr.io/reijbak/riwiwallet-frontend:latest
